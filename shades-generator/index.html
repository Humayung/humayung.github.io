<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGB → RGB / RGB565</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: monospace;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 16px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-family: monospace;
      font-size: 14px;
    }

    button {
      padding: 9px 18px;
      border: 0;
      border-radius: 5px;
      background: #222;
      color: white;
      font-family: monospace;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .result-card {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      padding: 9px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .color-box {
      width: 42px;
      height: 42px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .info {
      min-width: 0;
      line-height: 1.45;
      font-size: 13px;
    }

    .alpha {
      font-weight: bold;
      margin-bottom: 2px;
    }

    .rgb-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rgb {
      color: #555;
    }

    .rgb565 {
      font-weight: bold;
    }

    .outputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .output-section h3 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    .output-box {
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
      overflow-x: auto;
      cursor: pointer;
    }

    .hint {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }

    .error {
      color: #b00020;
      padding: 10px;
      background: #fff;
      border: 1px solid #e0b0b0;
      border-radius: 5px;
    }

    @media (max-width: 650px) {
      body {
        padding: 14px;
      }

      .results,
      .outputs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h2>ARGB → RGB / RGB565</h2>

  <div class="input-row">
    <input
      type="text"
      id="hexInput"
      placeholder="#RRGGBB"
      value="#FF0000"
      onkeydown="if(event.key === 'Enter') generateCompositeColors()"
    >
    <button onclick="generateCompositeColors()">Generate</button>
  </div>

  <div id="result"></div>

</div>

<script>
  function hexToRgb(hex) {
    hex = hex.trim().replace('#', '');

    if (!/^[0-9a-fA-F]{6}$/.test(hex)) {
      return null;
    }

    return {
      r: parseInt(hex.substring(0, 2), 16),
      g: parseInt(hex.substring(2, 4), 16),
      b: parseInt(hex.substring(4, 6), 16)
    };
  }


  // Normal ARGB composited over WHITE
  function compositeToWhite(r, g, b, alpha) {
    return {
      r: Math.round((1 - alpha) * 255 + alpha * r),
      g: Math.round((1 - alpha) * 255 + alpha * g),
      b: Math.round((1 - alpha) * 255 + alpha * b)
    };
  }


  // RGB565 composited over BLACK
  function compositeToBlack(r, g, b, alpha) {
    return {
      r: Math.round(alpha * r),
      g: Math.round(alpha * g),
      b: Math.round(alpha * b)
    };
  }


  // Convert 8-bit RGB → 16-bit RGB565
  //
  // R: 5 bits
  // G: 6 bits
  // B: 5 bits
  //
  // RRRRRGGGGGGBBBBB
  function rgbTo565(r, g, b) {
    const r5 = (r >> 3) & 0x1F;
    const g6 = (g >> 2) & 0x3F;
    const b5 = (b >> 3) & 0x1F;

    return (r5 << 11) | (g6 << 5) | b5;
  }


  function rgb565ToHex(value) {
    return '0x' + value
      .toString(16)
      .padStart(4, '0')
      .toUpperCase();
  }


  function rgbToHex(r, g, b) {
    return '#' + [r, g, b]
      .map(x => x.toString(16).padStart(2, '0'))
      .join('')
      .toUpperCase();
  }


  function escapeXml(str) {
    return str
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }


  function generateCompositeColors() {
    const hex = document.getElementById('hexInput').value;
    const rgb = hexToRgb(hex);
    const container = document.getElementById('result');

    container.innerHTML = '';

    if (!rgb) {
      container.innerHTML =
        '<div class="error">Invalid hex color. Use #RRGGBB.</div>';
      return;
    }


    /*
      100 → 82 → 64 → 46 → 28 → 10
    */
    const alphas = [100, 82, 64, 46, 28, 10];

    let xmlOutput = '';
    let rgb565Output = '';

    const cards = [];


    alphas.forEach((alphaPercent, index) => {

      const alpha = alphaPercent / 100;


      // --------------------------------
      // RGB → composite against WHITE
      // --------------------------------
      const composite = compositeToWhite(
        rgb.r,
        rgb.g,
        rgb.b,
        alpha
      );

      const hexResult = rgbToHex(
        composite.r,
        composite.g,
        composite.b
      );


      // --------------------------------
      // RGB565 → composite against BLACK
      // --------------------------------
      const composite565 = compositeToBlack(
        rgb.r,
        rgb.g,
        rgb.b,
        alpha
      );

      const rgb565 = rgbTo565(
        composite565.r,
        composite565.g,
        composite565.b
      );

      const rgb565Hex = rgb565ToHex(rgb565);


      cards.push(`
        <div class="result-card">

          <div
            class="color-box"
            style="background: rgba(
              ${rgb.r},
              ${rgb.g},
              ${rgb.b},
              ${alpha}
            )"
            title="Original ARGB"
          ></div>

          <div class="info">

            <div class="alpha">
              ${alphaPercent}% alpha
            </div>

            <div class="rgb-row">

              <span class="rgb">
                RGB: ${hexResult}
              </span>

              <span class="rgb565">
                RGB565: ${rgb565Hex}
              </span>

            </div>

            <div class="rgb-row">

              <span class="rgb">
                White: ${composite.r},
                ${composite.g},
                ${composite.b}
              </span>

              <span class="rgb">
                Black: ${composite565.r},
                ${composite565.g},
                ${composite565.b}
              </span>

            </div>

          </div>

        </div>
      `);


      // XML uses WHITE-composited RGB
      const xmlLine =
        `<color name="primary_${index + 1}" tools:override="true">${hexResult}</color>`;

      xmlOutput += escapeXml(xmlLine) + '\n';


      // RGB565 uses BLACK-composited RGB
      rgb565Output +=
        `primary_${index + 1} = ${rgb565Hex}\n`;
    });


    container.innerHTML = `

      <div class="results">
        ${cards.join('')}
      </div>

      <div class="outputs">

        <div class="output-section">
          <h3>RGB XML — white composite</h3>

          <div
            class="output-box"
            onclick="copyToClipboard(this)"
          >${xmlOutput}</div>

          <small class="hint">Click to copy</small>
        </div>


        <div class="output-section">
          <h3>RGB565 — black composite</h3>

          <div
            class="output-box"
            onclick="copyToClipboard(this)"
          >${rgb565Output}</div>

          <small class="hint">Click to copy</small>
        </div>

      </div>
    `;
  }


  function copyToClipboard(element) {
    const text = element.innerText;

    navigator.clipboard.writeText(text)
      .then(() => {
        const oldText = element.innerText;

        element.innerText = 'Copied!';

        setTimeout(() => {
          element.innerText = oldText;
        }, 700);
      })
      .catch(err => {
        alert('Failed to copy: ' + err);
      });
  }


  // Generate initial example
  generateCompositeColors();
</script>

</body>
</html>
